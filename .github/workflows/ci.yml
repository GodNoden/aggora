# Integración continua de Aggora.
#
# La separación es la de siempre: los tests UNITARIOS corren primero (tardan un segundo y no
# necesitan nada) y los de INTEGRACIÓN después, que son los que levantan Kafka, el Schema Registry y
# Postgres con Testcontainers y tardan minutos. Son dos jobs y no uno para que el de unitarios de la
# señal rápido aunque el de integración tarde o falle.
#
# Ojo con una cosa de este proyecto: aquí conviven TRES implementaciones (Spring, Quarkus y la de
# Lambda de la fase 10) y las tres se compilan y se prueban. El job `unit` construye el árbol
# entero (services/pom.xml es el agregador de las tres) y el `integration` solo la parte de Spring,
# que es donde están los *IT.
#
# El cuarto job (`infra`) no compila Java: valida la infraestructura de despliegue. Es barato y
# detecta lo que de verdad se rompe en un `main.tf` escrito a mano: un argumento que no existe en
# el proveedor de AWS. Un fichero de Terraform sin validar es documentación, no infraestructura.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitarios (Spring + Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `test` y no `verify`: así NO se levantan contenedores. Es el bucle rápido.
      - name: Compilar y probar las dos implementaciones
        working-directory: services
        run: mvn -B -ntp test

  artifacts:
    name: Paquete de despliegue (Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `test` no construye el jar gordo (eso es cosa del shade, en `package`), y el jar gordo ES
      # el paquete de despliegue de Lambda. Sin este job, un shade mal configurado no se detecta
      # hasta el día del despliegue.
      - name: Construir el paquete de la Lambda
        working-directory: services
        run: mvn -B -ntp -pl lambda/ingestion-normalizer-lambda -am package

      - uses: actions/upload-artifact@v4
        with:
          name: ingestion-normalizer-lambda
          path: services/lambda/ingestion-normalizer-lambda/target/*-shaded.jar
          if-no-files-found: error

  infra:
    name: Infraestructura (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Formato
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      # `init -backend=false` baja el proveedor de AWS pero no toca ningún estado remoto: en CI no
      # hay credenciales y no hacen falta, porque `validate` no habla con AWS, solo con el esquema
      # del proveedor.
      - name: Validar
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate

  integration:
    name: Integración (Testcontainers)
    runs-on: ubuntu-latest
    # Corre en cada push, en cada PR y a mano. Al principio lo condicione a los pull requests y
    # el job salia "skipped" en cada push: en un repo donde se empuja directo a main, eso es no
    # ejecutarlo NUNCA. Mejor cinco minutos de contenedores en cada push que un job decorativo.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` es lo que ejecuta los *IT (failsafe). El runner de GitHub ya trae Docker, que es
      # justo lo que no tiene el devcontainer del proyecto: por eso estas pruebas viven aquí.
      - name: Tests de integración de la implementación Spring
        working-directory: services
        run: mvn -B -ntp verify -pl spring/audit-log,spring/order-matching-engine -am
