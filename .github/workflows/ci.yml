# Integración continua de Aggora.
#
# La separación es la de siempre y es la importante: los tests UNITARIOS corren en cada push (tardan
# un segundo y no necesitan nada), y los de INTEGRACIÓN -los que levantan Kafka, el Schema Registry
# y Postgres con Testcontainers- solo en los pull requests y en las ejecuciones manuales, porque
# tardan minutos y arrancan contenedores.
#
# Ojo con una cosa de este proyecto: aquí conviven DOS implementaciones (Spring y Quarkus) y las dos
# se compilan y se prueban. El job `unit` construye el árbol entero (services/pom.xml es el
# agregador de las dos) y el `integration` solo la parte de Spring, que es donde están los *IT.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unitarios (Spring + Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `test` y no `verify`: así NO se levantan contenedores. Es el bucle rápido.
      - name: Compilar y probar las dos implementaciones
        working-directory: services
        run: mvn -B -ntp test

  integration:
    name: Integración (Testcontainers)
    runs-on: ubuntu-latest
    # Solo en pull requests y a mano: son minutos y arrancan contenedores de Kafka y Postgres.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` es lo que ejecuta los *IT (failsafe). El runner de GitHub ya trae Docker, que es
      # justo lo que no tiene el devcontainer del proyecto: por eso estas pruebas viven aquí.
      - name: Tests de integración de la implementación Spring
        working-directory: services
        run: mvn -B -ntp verify -pl spring/audit-log,spring/order-matching-engine -am
