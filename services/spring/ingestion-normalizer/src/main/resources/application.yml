spring:
  application:
    name: ingestion-normalizer

  kafka:
    # Nombre interno dentro de aggora-net. Nunca localhost (ver README).
        # Cluster de 3 brokers (Fase 6): se listan los tres para que si uno esta caido
    # el cliente se entere por los otros. Los topics usan replicas: 3.
    bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    consumer:
      # El group.id es lo que reparte particiones entre instancias: dos procesos con
      # el mismo group.id se reparten las 6 particiones; con otro, cada uno lee todo.
      group-id: ingestion-normalizer
      # Sin offset guardado, empieza por el principio del topic.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # El deserializador AVRO va ENVUELTO: si un mensaje no es Avro valido, el envoltorio
      # captura la excepcion y la deja en una cabecera en vez de reventar al consumidor.
      # Sin esto, un solo byte malo metia al normalizer en un bucle de reintentos que
      # escribio 17,4 GB de log en seis minutos (ver docs/decisions.md).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 200
      properties:
        # El deserializador de verdad, el de Confluent: lee el ID de esquema que lleva el
        # mensaje, pide el esquema al registry y lo convierte. Los mensajes son binarios.
        # ErrorHandlingDeserializer lo instancia el solo a partir de esta propiedad.
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        # Devolver la clase generada (com.aggora.avro.Tick) en vez de un GenericRecord.
        specific.avro.reader: true
        # Cuánto puede estar el proceso sin llamar a poll() antes de que el broker
        # lo expulse del grupo (y dispare un rebalanceo).
        max.poll.interval.ms: 300000
    # La Fase 2 convierte a este servicio en consumidor Y productor: publica el
    # evento canónico en market.ticks.canonical con su propio esquema.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
    # Común a consumidor y productor.
    properties:
      # Dentro de aggora-net se habla por nombre, como con el broker.
      schema.registry.url: http://schema-registry:8081
    listener:
      # CLAVE: el offset lo confirma el código, no el framework.
      ack-mode: manual_immediate
      concurrency: 1
      # Si el normalizador arranca antes que el simulador, el topic aún no existe:
      # avisa y sigue en vez de morir.
      missing-topics-fatal: false
      log-container-config: false

aggora:
  topics:
    ticks-raw: market.ticks.raw
    # El normalizer es el productor de este topic, así que lo declara él.
    ticks-canonical: market.ticks.canonical
    # Compactado: tipos de cambio de referencia (el ultimo valor de cada par).
    fx-reference: market.fx.reference
    # Descartes: lo que no se puede procesar, con el motivo en una cabecera.
    ticks-raw-dlt: market.ticks.raw.DLT
  # Retardo artificial por mensaje, en ms. 0 = desactivado.
  # Ponlo a 300 para poder matar la instancia a media faena y ver, al reiniciar,
  # que los mensajes no confirmados se vuelven a procesar (at-least-once).
  processing-delay-ms: 0
