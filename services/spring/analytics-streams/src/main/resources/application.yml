# El endpoint de consultas interactivas. Ojo con el puerto: el 8080 lo ocupa el
# simulador, asi que aqui se usa otro.
server:
  port: 8085
  # Detras de TLS (Cloudflare Tunnel o Caddy): las cabeceras X-Forwarded-* dicen el esquema real.
  forward-headers-strategy: framework

spring:
  application:
    name: analytics-streams

  kafka:
    # Nombre interno dentro de aggora-net. Nunca localhost (ver README).
    # Cluster de 3 brokers (Fase 6): se listan los tres para que si uno esta caido
    # el cliente se entere por los otros. Los topics usan replicas: 3.
    bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    streams:
      application-id: analytics-streams
      client-id: analytics-streams
      # Estado local de los state stores. Si se borra, Kafka Streams lo reconstruye
      # desde los topics de changelog.
      state-dir: /tmp/aggora-streams-state
      properties:
        # Los serdes por defecto son Avro: la topologia los usa al materializar estado.
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
        # El serde de Avro necesita saber donde esta el registry.
        schema.registry.url: http://schema-registry:8081
        # Topics internos de Streams (changelog y reparticion) con 3 replicas:
        # el estado de las ventanas tiene que sobrevivir a un broker caido.
        replication.factor: 3
        # Sin cache de estado: cada tick produce una metrica actualizada y se ve el
        # resultado al momento. Con cache se agruparia y habria menos escrituras.
        statestore.cache.max.bytes: 0
        commit.interval.ms: 1000
        # Un solo hilo y un solo broker en dev; en produccion esto se sube.
        num.stream.threads: 1
        # Si no hay offset guardado para el grupo, empieza por el principio del topic.
        auto.offset.reset: earliest

aggora:
  schema-registry-url: http://schema-registry:8081
  ui:
    # Allowlist de origenes del dashboard para /analytics y /actuator. Solo lectura y nada de "*".
    allowed-origins: http://localhost:4200,http://localhost:8080,http://localhost:8089,http://localhost:8189
  topics:
    ticks-canonical: market.ticks.canonical
    analytics: market.analytics
    arbitrage: market.arbitrage
    # Topic compactado con los tipos de cambio de referencia, que publica el normalizer.
    fx-reference: market.fx.reference
  # Ventanas cortas para poder ver resultados mientras miras.
  windows:
    tumbling-size: 30s    # bloques fijos de 30 s, sin solape
    hopping-size: 60s     # ventana de 60 s...
    hopping-advance: 15s  # ...recalculada cada 15 s (se solapa con la anterior)
    grace: 5s             # margen antes de dar una ventana por cerrada
  # La pareja de cotizaciones de la misma empresa que se cruzan para el spread.
  arbitrage:
    root-symbol: ASML
    european-symbol: ASML.AMS
    american-symbol: ASML
    quote-currency: USD
    # Los dos precios no llegan en el mismo milisegundo: hasta 5 s de separacion se
    # consideran comparables.
    join-window: 5s

# --- Metricas para Prometheus (Fase 8) -------------------------------------------
# El endpoint es /actuator/prometheus. Solo se publican salud y metricas: el resto
# de endpoints de actuator se quedan cerrados. Las series llevan las etiquetas
# stack y service, que son las que permiten poner en el mismo panel las dos
# implementaciones (stack="spring" y stack="quarkus") sin confundirlas.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      # La misma allowlist para los endpoints de actuator (health y prometheus).
      cors:
        allowed-origins: ${aggora.ui.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      # Los detalles se enseñan a proposito: cuando un contenedor esta DOWN, lo primero que
      # se hace es preguntarle por que, y "estado: ERROR" ahorra media hora. En un despliegue
      # con acceso publico esto se pone en never o detras de autenticacion.
      show-details: always
  metrics:
    tags:
      stack: spring
      service: ${spring.application.name}
