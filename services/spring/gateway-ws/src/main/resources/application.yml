server:
  # Un puerto propio: el 8080 es del simulador y el 8085 de la analitica.
  port: 8089
  # Detras de TLS (Cloudflare Tunnel o Caddy) las cabeceras X-Forwarded-* son las que dicen el
  # esquema y el host reales. Sin esto, el navegador bloquea ws:// desde una pagina https://.
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-ws

  kafka:
    bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    consumer:
      # Grupo propio: este servicio no compite con nadie, se suscribe a los MISMOS topics que ya
      # leen los demas y recibe su copia (es un consumidor de fan-out, no de trabajo).
      group-id: gateway-ws
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        schema.registry.url: http://schema-registry:8081
    properties:
      schema.registry.url: http://schema-registry:8081

aggora:
  schema-registry-url: http://schema-registry:8081
  # El nombre de esta implementacion, que viaja en cada mensaje del WebSocket y en /api/metrics.
  stack: spring
  # Prometheus por nombre interno (nunca localhost desde el devcontainer), del que este gateway
  # hace de proxy con un catalogo cerrado de paneles.
  prometheus-url: http://prometheus:9090
  ui:
    # Allowlist de origenes del dashboard. Solo lectura (GET) y nada de "*".
    allowed-origins: http://localhost:4200,http://localhost:8080,http://localhost:8089,http://localhost:8189
  topics:
    ticks-canonical: market.ticks.canonical
    portfolio-updates: portfolio.updates
    alerts: alerts.raised

# --- Metricas para Prometheus ---------------------------------------------------
# El endpoint es /actuator/prometheus, en el mismo puerto que la pagina (8089). Las etiquetas
# stack y service son las que permiten poner las dos implementaciones en el mismo panel.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      # La misma allowlist para los endpoints de actuator (health y prometheus).
      cors:
        allowed-origins: ${aggora.ui.allowed-origins}
        allowed-methods: GET
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      stack: spring
      service: ${spring.application.name}
