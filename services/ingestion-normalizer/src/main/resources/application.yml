spring:
  application:
    name: ingestion-normalizer

  kafka:
    # Nombre interno dentro de aggora-net. Nunca localhost (ver README).
    bootstrap-servers: kafka:9092
    consumer:
      # El group.id es lo que reparte particiones entre instancias: dos procesos con
      # el mismo group.id se reparten las 6 particiones; con otro, cada uno lee todo.
      group-id: ingestion-normalizer
      # Sin offset guardado, empieza por el principio del topic.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deserializador Avro de Confluent: lee el ID de esquema que lleva el mensaje,
      # pide el esquema al registry y lo convierte. Los mensajes son binarios.
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      max-poll-records: 200
      properties:
        # Devolver la clase generada (com.aggora.avro.Tick) en vez de un GenericRecord.
        specific.avro.reader: true
        # Cuánto puede estar el proceso sin llamar a poll() antes de que el broker
        # lo expulse del grupo (y dispare un rebalanceo).
        max.poll.interval.ms: 300000
    # La Fase 2 convierte a este servicio en consumidor Y productor: publica el
    # evento canónico en market.ticks.canonical con su propio esquema.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
    # Común a consumidor y productor.
    properties:
      # Dentro de aggora-net se habla por nombre, como con el broker.
      schema.registry.url: http://schema-registry:8081
    listener:
      # CLAVE: el offset lo confirma el código, no el framework.
      ack-mode: manual_immediate
      concurrency: 1
      # Si el normalizador arranca antes que el simulador, el topic aún no existe:
      # avisa y sigue en vez de morir.
      missing-topics-fatal: false
      log-container-config: false

aggora:
  topics:
    ticks-raw: market.ticks.raw
    # El normalizer es el productor de este topic, así que lo declara él.
    ticks-canonical: market.ticks.canonical
    # Compactado: tipos de cambio de referencia (el ultimo valor de cada par).
    fx-reference: market.fx.reference
  # Retardo artificial por mensaje, en ms. 0 = desactivado.
  # Ponlo a 300 para poder matar la instancia a media faena y ver, al reiniciar,
  # que los mensajes no confirmados se vuelven a procesar (at-least-once).
  processing-delay-ms: 0
