# El gateway de eventos en vivo en Quarkus (la pareja del gateway-ws de Spring).
#
# El mapeo con Spring:
#
#   @KafkaListener                    ->  @Incoming
#   @ServerEndpoint + Session         ->  @WebSocket + WebSocketConnection
#   session.getAsyncRemote()          ->  conexion.sendText() (ya es asincrono)
#   spring.kafka.consumer.*           ->  mp.messaging.incoming.<canal>.*
#
# Los topics y los nombres de canal son los mismos que en la version Spring a proposito; el
# group.id NO: cada implementacion tiene el suyo para que las dos reciban su propia copia y se
# puedan correr a la vez (un grupo de consumidores reparte, no copia).

quarkus.application.name=gateway-ws
quarkus.banner.enabled=false
quarkus.http.port=8189

# --- El dashboard: resumen del WebSocket, catalogo de metricas y CORS -----------
# El nombre de esta implementacion, que viaja en cada mensaje del WebSocket y en /api/metrics.
aggora.stack=quarkus
# Prometheus por nombre interno (nunca localhost desde el devcontainer): el gateway hace de proxy
# con un catalogo cerrado de paneles en /api/metrics.
aggora.prometheus-url=http://prometheus:9090

# CORS de SOLO LECTURA para el dashboard, que vive en otro origen. Misma lista que en Spring y
# nada de "*". Se puede sobreescribir por entorno: QUARKUS_HTTP_CORS_ORIGINS=http://mi-dominio
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,http://localhost:8089,http://localhost:8189
# Solo se permite leer (GET) y sin credenciales: el dashboard no manda cookies.
quarkus.http.cors.methods=GET
quarkus.http.cors.access-control-allow-credentials=false

# Detras de TLS (Cloudflare Tunnel o Caddy) las cabeceras X-Forwarded-* son las que dicen el
# esquema y el host reales. Sin esto, el navegador bloquea ws:// desde una pagina https://.
quarkus.http.proxy.proxy-address-forwarding=true

kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# Los topics, en un solo sitio: asi el stack paralelo los puede cambiar con -D.
aggora.topics.ticks-canonical=market.ticks.canonical
aggora.topics.portfolio-updates=portfolio.updates
aggora.topics.alerts=alerts.raised
aggora.topics.schema-registry-url=http://schema-registry:8081

# Avro 1.12.2, el del BOM de Quarkus, trae encendido el validador de clases: hay que declarar
# el paquete de las clases generadas o la deserializacion falla.
quarkus.avro.trusted-packages=com.aggora.avro

# --- Los tres canales de entrada ------------------------------------------------
# El mismo deserializador de Confluent que en Spring: lee el ID de esquema del mensaje, pide el
# esquema al registro y devuelve la clase generada (specific.avro.reader).
mp.messaging.incoming.ticks-canonical.connector=smallrye-kafka
mp.messaging.incoming.ticks-canonical.topic=${aggora.topics.ticks-canonical}
mp.messaging.incoming.ticks-canonical.group.id=gateway-ws-quarkus
mp.messaging.incoming.ticks-canonical.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.ticks-canonical.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.ticks-canonical.specific.avro.reader=true
mp.messaging.incoming.ticks-canonical.schema.registry.url=${aggora.topics.schema-registry-url}
mp.messaging.incoming.ticks-canonical.auto.offset.reset=latest
# Un mensaje ilegible no puede congelar la pantalla: se registra y se sigue.
# (En Spring el listener por defecto reintenta; aqui se elige seguir, y queda dicho.)
mp.messaging.incoming.ticks-canonical.failure-strategy=ignore

mp.messaging.incoming.portfolio-updates.connector=smallrye-kafka
mp.messaging.incoming.portfolio-updates.topic=${aggora.topics.portfolio-updates}
mp.messaging.incoming.portfolio-updates.group.id=gateway-ws-quarkus
mp.messaging.incoming.portfolio-updates.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.portfolio-updates.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.portfolio-updates.specific.avro.reader=true
mp.messaging.incoming.portfolio-updates.schema.registry.url=${aggora.topics.schema-registry-url}
mp.messaging.incoming.portfolio-updates.auto.offset.reset=latest
mp.messaging.incoming.portfolio-updates.failure-strategy=ignore

mp.messaging.incoming.alerts.connector=smallrye-kafka
mp.messaging.incoming.alerts.topic=${aggora.topics.alerts}
mp.messaging.incoming.alerts.group.id=gateway-ws-quarkus
mp.messaging.incoming.alerts.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.alerts.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.alerts.specific.avro.reader=true
mp.messaging.incoming.alerts.schema.registry.url=${aggora.topics.schema-registry-url}
mp.messaging.incoming.alerts.auto.offset.reset=latest
mp.messaging.incoming.alerts.failure-strategy=ignore

# --- Dev Services (solo para los tests) ---
quarkus.kafka.devservices.enabled=true
