# El motor de Kafka Streams (Fase 8). El application-id y los topics son los MISMOS que en la
# version Spring, asi que el port es intercambiable.

quarkus.kafka-streams.application-id=portfolio-risk
quarkus.kafka-streams.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
# La extension espera a que existan los topics de origen antes de arrancar el motor.
quarkus.kafka-streams.topics=orders.executions

# --- El resto del motor, con el prefijo kafka-streams ---
kafka-streams.replication.factor=3
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.commit.interval.ms=1000
kafka-streams.num.stream.threads=1
kafka-streams.auto.offset.reset=earliest
kafka-streams.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
kafka-streams.default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
kafka-streams.schema.registry.url=http://schema-registry:8081
# El estado local de las posiciones (directorio propio, para no mezclarlo con el de Spring).
kafka-streams.state.dir=/tmp/aggora-portfolio-state-quarkus

# CLAVE: el motor de matching publica las ejecuciones en TRANSACCIONES. Si aqui se leyera con
# read_uncommitted entrarian tambien las ejecuciones ABORTADAS y las posiciones contarian
# operaciones que en realidad no ocurrieron.
kafka-streams.isolation.level=read_committed

# La validacion de clases de Avro que enciende la extension de Quarkus: sin esto, los serdes de
# Streams fallan al resolver la clase desde el esquema (ver docs/decisions.md).
quarkus.avro.trusted-packages=com.aggora.avro

# Para el creador de topics.
kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
