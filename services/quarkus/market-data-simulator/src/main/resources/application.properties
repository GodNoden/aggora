# Quarkus valida por defecto que TODA propiedad de un prefijo mapeado tenga su miembro en la
# interfaz de configuracion, y aqui hay cuatro que no lo tienen a proposito: los intervalos de los
# jobs (tick-interval-ms, poll-interval-ms, initial-delay-ms, order-interval-ms) los leen las
# anotaciones @Scheduled, no el codigo. En la version Spring pasa lo mismo y tambien se quedan
# fuera del record. Se apaga la validacion para no duplicar esos campos en la interfaz.
quarkus.config.mapping.validate-unknown=false

# --- CORS de solo lectura para el dashboard (otro origen) -----------------------
# El dashboard lee la consulta interactiva desde otro origen, asi que el simulador tambien abre
# su HTTP en solo lectura. Misma lista que Spring y nada de "*".
# Se puede sobreescribir por entorno: QUARKUS_HTTP_CORS_ORIGINS=http://mi-dominio
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,http://localhost:8089,http://localhost:8189
# Solo se permite leer (GET) y sin credenciales: el dashboard no manda cookies.
quarkus.http.cors.methods=GET
quarkus.http.cors.access-control-allow-credentials=false

# Detras de TLS (Cloudflare Tunnel o Caddy): las cabeceras X-Forwarded-* dicen el esquema real.
quarkus.http.proxy.proxy-address-forwarding=true

# Canales de Kafka del simulador en Quarkus (Fase 8).
#
# El equivalente a spring.kafka.producer.* y a los beans KafkaTemplate de la version Spring: aqui
# cada topic es un CANAL de SmallRye con su serializador.
#
# La key sigue siendo el simbolo en los dos topics, y los serializadores son los de Confluent: los
# mensajes son byte a byte los mismos que los de Spring, que es lo que permite intercambiar una
# implementacion por otra.

# --- Los dos proveedores de precios, como clientes REST declarativos ---
# La URL base va aqui (la api key viaja como parametro de la llamada, leida de aggora.*).
quarkus.rest-client.twelve-data.url=https://api.twelvedata.com
quarkus.rest-client.alpha-vantage.url=https://www.alphavantage.co

# Nombre interno dentro de aggora-net, nunca localhost (ver README). Los tres brokers.
kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# --- Productor: ticks crudos -----------------------------------------------------
mp.messaging.outgoing.ticks-raw.connector=smallrye-kafka
mp.messaging.outgoing.ticks-raw.topic=market.ticks.raw
mp.messaging.outgoing.ticks-raw.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ticks-raw.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.ticks-raw.schema.registry.url=http://schema-registry:8081
# acks=all y productor idempotente: un reintento por fallo transitorio no duplica el mensaje.
mp.messaging.outgoing.ticks-raw.acks=all
mp.messaging.outgoing.ticks-raw.enable.idempotence=true
mp.messaging.outgoing.ticks-raw.compression.type=lz4
mp.messaging.outgoing.ticks-raw.linger.ms=20

# --- Productor: ordenes simuladas ------------------------------------------------
mp.messaging.outgoing.orders-incoming.connector=smallrye-kafka
mp.messaging.outgoing.orders-incoming.topic=orders.incoming
mp.messaging.outgoing.orders-incoming.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-incoming.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.orders-incoming.schema.registry.url=http://schema-registry:8081
mp.messaging.outgoing.orders-incoming.acks=all
mp.messaging.outgoing.orders-incoming.enable.idempotence=true
