# El motor de matching en Quarkus (Fase 8).
#
# Los topics, el group.id y los serializadores son LOS MISMOS que en la version Spring, asi que el
# port es intercambiable.

quarkus.application.name=order-matching-engine
quarkus.banner.enabled=false

kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# --- Consumidor: orders.incoming ---
mp.messaging.incoming.orders-incoming.connector=smallrye-kafka
mp.messaging.incoming.orders-incoming.topic=orders.incoming
mp.messaging.incoming.orders-incoming.group.id=order-matching-engine
mp.messaging.incoming.orders-incoming.auto.offset.reset=earliest
mp.messaging.incoming.orders-incoming.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders-incoming.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.orders-incoming.specific.avro.reader=true
mp.messaging.incoming.orders-incoming.schema.registry.url=http://schema-registry:8081
mp.messaging.incoming.orders-incoming.max.poll.records=200
# Solo se ve lo CONFIRMADO: las ejecuciones abortadas por una transaccion no entran.
mp.messaging.incoming.orders-incoming.isolation.level=read_committed
# El commit lo lleva la TRANSACCION (withTransactionAndAck), no el ack suelto.
mp.messaging.incoming.orders-incoming.enable.auto.commit=false

# --- Productor transaccional: ordenes.executions ---
mp.messaging.outgoing.executions.connector=smallrye-kafka
mp.messaging.outgoing.executions.topic=orders.executions
mp.messaging.outgoing.executions.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.executions.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.executions.schema.registry.url=http://schema-registry:8081
# La transaccion la abre SmallRye (KafkaTransactions), pero el productor tiene que ser
# transaccional e idempotente de verdad.
mp.messaging.outgoing.executions.transactional=true
mp.messaging.outgoing.executions.enable.idempotence=true
mp.messaging.outgoing.executions.acks=all

# --- Productor: descartes, con el motivo en una cabecera ---
mp.messaging.outgoing.orders-incoming-dlt.connector=smallrye-kafka
mp.messaging.outgoing.orders-incoming-dlt.topic=orders.incoming.DLT
mp.messaging.outgoing.orders-incoming-dlt.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-incoming-dlt.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.orders-incoming-dlt.schema.registry.url=http://schema-registry:8081

# La validacion de clases de Avro de Quarkus (la enciende la extension; ver docs/decisions.md).
quarkus.avro.trusted-packages=com.aggora.avro

# --- Configuracion de Aggora (los mismos nombres que el bloque aggora: del yml de Spring) ---
aggora.schema-registry-url=http://schema-registry:8081
aggora.topics.orders-incoming=orders.incoming
aggora.topics.executions=orders.executions
# Ejercicio de exactly-once: 0 = desactivado. Con 10, una de cada ~10 ordenes es venenosa.
aggora.fail-every-n-orders=0
