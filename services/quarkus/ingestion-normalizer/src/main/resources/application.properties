# El normalizer en Quarkus (Fase 8).
#
# El equivalente a cada pieza de la version Spring:
#
#   @KafkaListener + Acknowledgment     ->  @Incoming + record.ack()
#   KafkaTemplate (uno por tipo)        ->  @Channel Emitter (un canal por topic)
#   spring.kafka.consumer.*             ->  mp.messaging.incoming.<canal>.*
#   spring.kafka.producer.*             ->  mp.messaging.outgoing.<canal>.*
#
# Los topics y el group.id son LOS MISMOS que en la version Spring a proposito: asi el port
# es intercambiable (se puede parar uno y arrancar el otro y el pipeline ni se entera) y las
# dos implementaciones se pueden comparar de verdad.

quarkus.application.name=ingestion-normalizer
quarkus.banner.enabled=false

# Nombre interno dentro de aggora-net, nunca localhost (ver README). Se listan los tres
# brokers para que si uno esta caido el cliente se entere por los otros.
kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# --- Consumidor: market.ticks.raw ------------------------------------------------
mp.messaging.incoming.ticks-raw.connector=smallrye-kafka
mp.messaging.incoming.ticks-raw.topic=market.ticks.raw
mp.messaging.incoming.ticks-raw.group.id=ingestion-normalizer
mp.messaging.incoming.ticks-raw.auto.offset.reset=earliest
mp.messaging.incoming.ticks-raw.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# El mismo deserializador de Confluent: lee el ID de esquema del mensaje, pide el esquema
# al registro y lo convierte. Con specific.avro.reader devuelve la clase generada.
mp.messaging.incoming.ticks-raw.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.ticks-raw.specific.avro.reader=true
mp.messaging.incoming.ticks-raw.schema.registry.url=http://schema-registry:8081
mp.messaging.incoming.ticks-raw.max.poll.records=200
mp.messaging.incoming.ticks-raw.max.poll.interval.ms=300000
# EL COMMIT LO HACE EL CODIGO. En SmallRye esto son dos cosas: apagar el commit automatico
# (enable.auto.commit=false) y decirle que la confirmacion de un mensaje se convierte en un
# commit de su offset (commit-strategy=latest). Es el equivalente al MANUAL de Spring.
mp.messaging.incoming.ticks-raw.enable.auto.commit=false
mp.messaging.incoming.ticks-raw.commit-strategy=latest
# Si el metodo lanza una excepcion, se registra y se sigue (no se para el canal): es lo mismo
# que hace la version Spring, donde el error se loguea y el offset se confirma igual.
mp.messaging.incoming.ticks-raw.failure-strategy=ignore
# El listener que cuenta los rebalanceos en el log (bean de CDI con @Named).
mp.messaging.incoming.ticks-raw.consumer-rebalance-listener.name=rebalance-log

# --- Productor: el evento canonico ----------------------------------------------
mp.messaging.outgoing.ticks-canonical.connector=smallrye-kafka
mp.messaging.outgoing.ticks-canonical.topic=market.ticks.canonical
mp.messaging.outgoing.ticks-canonical.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ticks-canonical.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.ticks-canonical.schema.registry.url=http://schema-registry:8081
mp.messaging.outgoing.ticks-canonical.acks=all
mp.messaging.outgoing.ticks-canonical.enable.idempotence=true

# --- Productor: tipos de cambio de referencia (topic compactado) -----------------
mp.messaging.outgoing.fx-reference.connector=smallrye-kafka
mp.messaging.outgoing.fx-reference.topic=market.fx.reference
mp.messaging.outgoing.fx-reference.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fx-reference.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.fx-reference.schema.registry.url=http://schema-registry:8081

# --- Productor: descartes, con el motivo en una cabecera -------------------------
mp.messaging.outgoing.ticks-raw-dlt.connector=smallrye-kafka
mp.messaging.outgoing.ticks-raw-dlt.topic=market.ticks.raw.DLT
mp.messaging.outgoing.ticks-raw-dlt.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ticks-raw-dlt.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.ticks-raw-dlt.schema.registry.url=http://schema-registry:8081

# Retardo artificial por mensaje, en ms: sirve para poder matar el proceso a media faena y
# ver el at-least-once. 0 = desactivado.
aggora.processing-delay-ms=0
