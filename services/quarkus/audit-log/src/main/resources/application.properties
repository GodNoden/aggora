# La auditoria en Quarkus (Fase 8).
#
# Los topics, el group.id y los serializadores son LOS MISMOS que en la version Spring. Sin servidor
# web (la de Spring tampoco lo tiene): es un consumidor, un publicador y una base de datos.

quarkus.application.name=audit-log
quarkus.banner.enabled=false

# Postgres: mismo contenedor y mismas credenciales que la version Spring.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=aggora
quarkus.datasource.password=aggora
quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/aggora

kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# --- Los tres consumidores, uno por topic (con su tipo Avro) ---
mp.messaging.incoming.executions.connector=smallrye-kafka
mp.messaging.incoming.executions.topic=orders.executions
mp.messaging.incoming.executions.group.id=audit-log
mp.messaging.incoming.executions.auto.offset.reset=earliest
mp.messaging.incoming.executions.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.executions.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.executions.specific.avro.reader=true
mp.messaging.incoming.executions.schema.registry.url=http://schema-registry:8081
mp.messaging.incoming.executions.failure-strategy=ignore

mp.messaging.incoming.portfolio-updates.connector=smallrye-kafka
mp.messaging.incoming.portfolio-updates.topic=portfolio.updates
mp.messaging.incoming.portfolio-updates.group.id=audit-log
mp.messaging.incoming.portfolio-updates.auto.offset.reset=earliest
mp.messaging.incoming.portfolio-updates.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.portfolio-updates.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.portfolio-updates.specific.avro.reader=true
mp.messaging.incoming.portfolio-updates.schema.registry.url=http://schema-registry:8081
mp.messaging.incoming.portfolio-updates.failure-strategy=ignore

mp.messaging.incoming.alerts.connector=smallrye-kafka
mp.messaging.incoming.alerts.topic=alerts.raised
mp.messaging.incoming.alerts.group.id=audit-log
mp.messaging.incoming.alerts.auto.offset.reset=earliest
mp.messaging.incoming.alerts.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.alerts.value.deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
mp.messaging.incoming.alerts.specific.avro.reader=true
mp.messaging.incoming.alerts.schema.registry.url=http://schema-registry:8081
mp.messaging.incoming.alerts.failure-strategy=ignore

# --- El publicador de la outbox ---
mp.messaging.outgoing.audit-events.connector=smallrye-kafka
mp.messaging.outgoing.audit-events.topic=audit.events
mp.messaging.outgoing.audit-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.audit-events.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
mp.messaging.outgoing.audit-events.schema.registry.url=http://schema-registry:8081
mp.messaging.outgoing.audit-events.acks=all
mp.messaging.outgoing.audit-events.enable.idempotence=true

# La validacion de clases de Avro de Quarkus (ver docs/decisions.md).
quarkus.avro.trusted-packages=com.aggora.avro

# --- Configuracion de Aggora (los mismos nombres que el bloque aggora: del yml de Spring) ---
aggora.schema-registry-url=http://schema-registry:8081
aggora.topics.executions=orders.executions
aggora.topics.portfolio-updates=portfolio.updates
aggora.topics.alerts=alerts.raised
aggora.topics.audit-events=audit.events
aggora.relay-interval-ms=1000
aggora.relay-batch-size=200
