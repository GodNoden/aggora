# El motor de Kafka Streams, configurado para la extension de Quarkus (Fase 8).
#
#   quarkus.kafka-streams.*  ->  lo que necesita la extension para montar el motor
#   kafka-streams.*          ->  el resto de la configuracion de Kafka Streams, tal cual
#
# El application-id y los topics son LOS MISMOS que en la version Spring: asi el port es
# intercambiable (se para uno y arranca el otro y sigue desde el mismo sitio).

quarkus.kafka-streams.application-id=analytics-streams
quarkus.kafka-streams.bootstrap-servers=kafka-1:9092,kafka-2:9092,kafka-3:9092

# --- CORS de solo lectura para el dashboard (otro origen) -----------------------
# Misma lista que en Spring y nada de "*". Se puede sobreescribir por entorno:
# QUARKUS_HTTP_CORS_ORIGINS=http://mi-dominio
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,http://localhost:8089,http://localhost:8189
# Solo se permite leer (GET) y sin credenciales: el dashboard no manda cookies.
quarkus.http.cors.methods=GET
quarkus.http.cors.access-control-allow-credentials=false

# Detras de TLS (Cloudflare Tunnel o Caddy): las cabeceras X-Forwarded-* dicen el esquema real.
quarkus.http.proxy.proxy-address-forwarding=true

# Los topics que este servicio LEE. La extension espera a que existan antes de arrancar el motor,
# que es justo la carrera que en la Fase 6 hubo que resolver a mano en el script de arranque
# (MissingSourceTopicException: Kafka Streams falla si su topic de origen no existe todavia).
quarkus.kafka-streams.topics=market.ticks.canonical,market.fx.reference

# --- El resto del motor, con el prefijo kafka-streams ---
# Topics internos de Streams (changelog y reparticion) con 3 replicas: el estado de las ventanas
# tiene que sobrevivir a un broker caido.
kafka-streams.replication.factor=3
# Sin cache de estado: cada tick produce una metrica actualizada y se ve el resultado al momento.
kafka-streams.statestore.cache.max.bytes=0
kafka-streams.commit.interval.ms=1000
kafka-streams.num.stream.threads=1
# Si no hay offset guardado para el grupo, empieza por el principio del topic.
kafka-streams.auto.offset.reset=earliest
# Los serdes por defecto son Avro: la topologia los usa al materializar estado.
kafka-streams.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
kafka-streams.default.value.serde=io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
kafka-streams.schema.registry.url=http://schema-registry:8081
# El estado local de los state stores. Se usa un directorio DISTINTO al de la version Spring para
# no mezclar las dos implementaciones: al arrancar, Kafka Streams lo reconstruye desde los topics
# de changelog (que es lo que hace que el estado sobreviva a un reinicio).
kafka-streams.state.dir=/tmp/aggora-streams-state-quarkus

# --- Avro: la validacion de clases de Quarkus ---
# La extension quarkus-avro ENCIENDE el validador de clases de Avro (ClassSecurityValidator), que
# por defecto solo se fia de las clases que puede indexar. Con los serdes de Kafka Streams eso no
# basta: SpecificAvroSerde resuelve la clase a partir del esquema (ClassUtils.forName) y sin esto
# revienta al primer mensaje con "Forbidden com.aggora.avro.canonical.CanonicalTick! This class is
# not trusted to be included in Avro schemas". En Spring el validador se queda apagado y por eso
# alli no hacia falta nada.
quarkus.avro.trusted-packages=com.aggora.avro

# Para el creador de topics (y para cualquier cliente de Kafka del servicio).
kafka.bootstrap.servers=kafka-1:9092,kafka-2:9092,kafka-3:9092
