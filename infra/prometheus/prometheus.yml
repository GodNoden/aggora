# Prometheus: recoge las metricas de Kafka y las de las aplicaciones.
#
# Dos trabajos de scrape:
#
#   1. kafka-exporter, que es quien sabe de lag, offsets y throughput (Prometheus no habla
#      el protocolo de Kafka).
#   2. Las aplicaciones, en /actuator/prometheus (Spring) y en /q/metrics (Quarkus). Es lo que
#      permite poner en el mismo panel las dos implementaciones. Ojo con el detalle: en el mismo
#      trabajo de scrape no se pueden mezclar las dos rutas, asi que las de Quarkus (8185 y 8189)
#      van en su propio trabajo mas abajo.
#
# Los servicios corren DENTRO del devcontainer, no como contenedores de aggora-net, asi que
# se llega a ellos por host.docker.internal (Docker Desktop lo resuelve solo en Windows/WSL2;
# en Docker sobre Linux hay que anadirle extra_hosts: ["host.docker.internal:host-gateway"]).
# El nombre del contenedor del devcontainer NO resuelve desde aqui: se probo y no funciona.
#
# Las etiquetas stack y service NO se ponen aqui: las mete la propia aplicacion en sus
# metricas (management.metrics.tags en Spring, quarkus.micrometer.binder... en Quarkus).
# Ponerlas tambien en el scrape haria que Prometheus renombrase las de dentro a
# exported_stack, que es exactamente el lio que se quiere evitar.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aggora-apps
    metrics_path: /actuator/prometheus
    static_configs:
      # Los tres servicios con servidor web y, por tanto, con /actuator/prometheus:
      # market-data-simulator (8080), analytics-streams (8085) y gateway-ws (8089, que tiene
      # servidor porque un WebSocket necesita uno). A los otros habria que anadirles
      # spring-boot-starter-web solo para mirarles la memoria, y eso cambiaria justo lo que
      # se quiere medir.
      #
      # CUIDADO con host.docker.internal: solo funciona para los puertos que el host de WSL2
      # tiene reenviados. Un puerto que no este en esa lista aparece aqui como "connection
      # refused" aunque el servicio este perfectamente vivo, y el sintoma enganya (parece que el
      # servicio esta caido y lo que falta es el reenvio). Los tres puertos de este trabajo
      # estan declarados en forwardPorts (.devcontainer/devcontainer.json) para que no dependan
      # del auto-descubrimiento de VS Code; si el target aparece caido tras arrancar los
      # servicios, lo primero que hay que mirar es el panel Ports, no los logs del servicio.
      - targets: ["host.docker.internal:8080"]
      - targets: ["host.docker.internal:8085"]
      - targets: ["host.docker.internal:8089"]

  # Las aplicaciones de Quarkus exponen las metricas en OTRA ruta (/q/metrics), y en un trabajo
  # de scrape no se pueden mezclar rutas: cada uno tiene la suya. Las etiquetas stack/service
  # las sigue poniendo la aplicacion, no el scrape.
  - job_name: aggora-apps-quarkus
    metrics_path: /q/metrics
    static_configs:
      # 8185: la analitica de Quarkus. 8189: su gateway en vivo (8289 si corre el stack paralelo).
      - targets: ["host.docker.internal:8185"]
      - targets: ["host.docker.internal:8189"]
