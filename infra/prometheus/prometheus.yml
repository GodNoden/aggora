# Prometheus: recoge las metricas de Kafka y las deja consultables.
#
# Solo hay un trabajo de scrape: el kafka-exporter, que es quien sabe de lag y de offsets
# (Prometheus no habla el protocolo de Kafka). Para metricas de las aplicaciones (JVM,
# tareas de Kafka Streams) habria que anadir actuator + micrometer a cada servicio y otro
# trabajo aqui; queda como mejora.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
