services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: aggora-kafka
    hostname: kafka
    ports:
      # Solo publicamos el listener EXTERNAL hacia WSL/Windows.
      # El INTERNAL (9092) no se publica: vive solo dentro de aggora-net.
      - "29092:29092"
    environment:
      # --- Identidad del nodo ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # cualquier base64 de 22 chars

      # --- Listeners ---
      # Escuchamos en tres puertos:
      #   9092 -> INTERNAL (para contenedores de aggora-net)
      #   9093 -> CONTROLLER (uso interno de KRaft, no es para clientes)
      #   29092 -> EXTERNAL (para procesos fuera de Docker)
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Qué dirección le dice Kafka a cada cliente según el listener
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      # --- Roles internos ---
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- Ajustes para dev (un solo broker, sin réplicas) ---
      # En producción estos tres cambian; los tocamos en Fase 6.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Nada de topics fantasma: solo existen los que declara el codigo con NewTopic.
      # Con la autocreacion activa, un typo en un nombre crea un topic de 1 particion
      # en silencio y el error aparece mucho despues (nos paso con un console consumer).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - aggora-net

  # Topics internos que NO declara el codigo de la aplicacion. Con la autocreacion
  # apagada hay que crearlos aqui: el Schema Registry no crea su propio _schemas si
  # auto.create.topics.enable esta en false, y sin el se queda atascado (y el
  # serializador Avro bloquea al productor, porque serializa en su mismo hilo).
  # Es un contenedor de un solo uso: crea y termina.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: aggora-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        echo "topics internos listos"
    networks:
      - aggora-net

  # Schema Registry (Fase 2): guarda los esquemas Avro y decide si un cambio de
  # esquema es compatible. No es un broker: es un servicio HTTP que además usa
  # Kafka por dentro para guardarse a sí mismo (el topic _schemas).
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    container_name: aggora-schema-registry
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      # Publicado para poder mirarlo desde WSL/Windows con curl.
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Se habla con el broker por el nombre interno de aggora-net.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      # Dev: un solo broker, así que los topics internos van sin réplicas.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - aggora-net

  # Postgres (Fase 5): lo necesita el patron transactional outbox del audit-log.
  postgres:
    image: postgres:16-alpine
    container_name: aggora-postgres
    hostname: postgres
    ports:
      # Publicado para poder mirarlo desde WSL/Windows con psql.
      - "5432:5432"
    environment:
      # Credenciales de desarrollo, las que fija el README. NO son de produccion.
      POSTGRES_USER: aggora
      POSTGRES_PASSWORD: aggora
      POSTGRES_DB: aggora
    networks:
      - aggora-net

networks:
  aggora-net:
    # "external: true" = la red ya existe (la creaste a mano) y NO debe
    # ser destruida cuando hagas `docker compose down`.
    external: true
    name: aggora-net
