services:
  # Cluster de 3 brokers en KRaft (Fase 6). Los tres nodos son a la vez broker y
  # controller, con quorum entre ellos: es lo que permite replicas: 3 y sobrevivir a la
  # caida de un nodo. La configuracion comun va en un ancla de YAML para no repetirla.
  kafka-1: &kafka-common
    image: apache/kafka:3.9.0
    container_name: aggora-kafka-1
    hostname: kafka-1
    ports:
      - "29092:29092"
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      # --- Replicacion: el objetivo de la fase ---
      # 3 copias de cada particion y, para dar una escritura por buena, al menos 2
      # copias confirmadas. Con eso, un broker caido se sobrevive; dos, no se escribe
      # (que es la garantia: mejor parar que perder datos).
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Nada de topics fantasma: solo existen los que declara el codigo con NewTopic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    restart: unless-stopped
    networks:
      - aggora-net

  kafka-2:
    <<: *kafka-common
    container_name: aggora-kafka-2
    hostname: kafka-2
    ports:
      - "29093:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093

  kafka-3:
    <<: *kafka-common
    container_name: aggora-kafka-3
    hostname: kafka-3
    ports:
      - "29094:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:29094

  # Schema Registry (Fase 2): guarda los esquemas Avro y decide si un cambio de
  # esquema es compatible. No es un broker: es un servicio HTTP que además usa
  # Kafka por dentro para guardarse a sí mismo (el topic _schemas).
  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    container_name: aggora-schema-registry
    # Si se reinicia Docker Desktop/WSL, este contenedor vuelve solo.
    restart: unless-stopped
    hostname: schema-registry
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      # Publicado para poder mirarlo desde WSL/Windows con curl.
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Se habla con el broker por el nombre interno de aggora-net.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,kafka-2:9092,kafka-3:9092
      # Dev: un solo broker, así que los topics internos van sin réplicas.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - aggora-net

  # Postgres (Fase 5): lo necesita el patron transactional outbox del audit-log.
  postgres:
    image: postgres:16-alpine
    container_name: aggora-postgres
    # Si se reinicia Docker Desktop/WSL, este contenedor vuelve solo.
    restart: unless-stopped
    hostname: postgres
    ports:
      # Publicado para poder mirarlo desde WSL/Windows con psql.
      - "5432:5432"
    environment:
      # Credenciales de desarrollo, las que fija el README. NO son de produccion.
      POSTGRES_USER: aggora
      POSTGRES_PASSWORD: aggora
      POSTGRES_DB: aggora
    networks:
      - aggora-net

  # Metricas de Kafka. Prometheus no habla el protocolo de Kafka, hace falta alguien que
  # traduzca: el exporter publica el lag por grupo y los offsets por topic.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: aggora-kafka-exporter
    hostname: kafka-exporter
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    # Ojo: esta opcion NO acepta una lista con comas; hay que repetirla por broker,
    # o el exporter intenta resolver la cadena entera como si fuese un solo host.
    command:
      - "--kafka.server=kafka-1:9092"
      - "--kafka.server=kafka-2:9092"
      - "--kafka.server=kafka-3:9092"
    ports:
      - "9308:9308"
    restart: unless-stopped
    networks:
      - aggora-net

  # Recoge las metricas y las deja consultables.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aggora-prometheus
    hostname: prometheus
    depends_on:
      - kafka-exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - aggora-net

  # Pinta las metricas. El panel y la fuente de datos van PROVISIONADOS: estan en el repo,
  # asi que no hay que configurar nada a mano ni exportar nada al terminar.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: aggora-grafana
    hostname: grafana
    depends_on:
      - prometheus
    environment:
      # En desarrollo se abre sin login (rol Admin). Las credenciales del README siguen
      # valiendo para la API.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - aggora-net

networks:
  aggora-net:
    # "external: true" = la red ya existe (la creaste a mano) y NO debe
    # ser destruida cuando hagas `docker compose down`.
    external: true
    name: aggora-net
